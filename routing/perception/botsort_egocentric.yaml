# BoT-SORT settings for a moving wearable camera.
tracker_type: botsort

# Low-confidence detections may continue an existing track, but a new ID needs
# substantially stronger evidence. This cuts down one-frame false tracks.
track_high_thresh: 0.40
track_low_thresh: 0.15
new_track_thresh: 0.50

# At the default 8 tracker FPS this keeps a temporarily hidden object for about
# six seconds. It does not promise identity after the object leaves for longer.
track_buffer: 50
match_thresh: 0.80
fuse_score: true

# Compensate for the whole image moving with the glasses.
gmc_method: sparseOptFlow

# Use detector appearance features as well as motion and box overlap.
proximity_thresh: 0.30
appearance_thresh: 0.75
with_reid: true
model: auto
